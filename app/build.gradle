apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.sutstudio.numberedapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.sutstudio.numberedapp"
        // Keep API 21 compatibility; the app uses OneSignal's standard FCM registration.
        minSdk 21
        targetSdk 34

        versionCode 110
        versionName "1.1.0"
    }

    // Release signing is read from environment variables that Codemagic injects
    // from the keystore configured under Teams > Code signing identities.
    // Nothing secret is stored in this repository.
    signingConfigs {
        release {
            def keystorePath = System.getenv("CM_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("CM_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    // OneSignal push notifications.
    implementation 'com.onesignal:OneSignal:5.11.0'
    // OneSignal's requestPermission() API is suspend-based.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// Firebase configuration for the Android application (app/google-services.json).
// Keep the Google Services plugin for the standard Firebase/FCM setup.
// Must stay at the bottom of the file.
apply plugin: 'com.google.gms.google-services'
