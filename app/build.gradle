apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.sutstudio.numberedapp'
    compileSdk 34

defaultConfig {
    applicationId "com.sutstudio.numberedapp"
    // 23: required by firebase-messaging 25.x, which OneSignal's Firebase Installation ID
    // (FID) push registration needs (OneSignal docs: "Android API 23+ for 25.x").
    minSdk 23
    targetSdk 34

    versionCode 110
    versionName "1.1.0"
}

    // Release signing is read from environment variables that Codemagic injects
    // from the keystore configured under Teams > Code signing identities.
    // Nothing secret is stored in this repository.
    signingConfigs {
        release {
            def keystorePath = System.getenv("CM_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("CM_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    // OneSignal push notifications (Stable channel per onesignal.github.io/sdk-releases/releases.json)
    implementation 'com.onesignal:OneSignal:5.11.0'
    // OneSignal declares coroutines as runtime-only; requestPermission() is a suspend
    // function, so the app needs them on its compile classpath. Same version OneSignal 5.9.2 uses.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // FID push registration (enabled in AndroidManifest.xml) needs firebase-messaging 25.1.2+.
    // OneSignal's own transitive range is lower, which leaves FID registration unavailable
    // (OneSignal status -33). Range recommended by OneSignal's Firebase Installation ID docs.
    implementation 'com.google.firebase:firebase-messaging:[25.1.2, 25.99.99]'
}

// Firebase config for com.sutstudio.numberedapp (app/google-services.json).
// FID registration needs this default FirebaseApp (OneSignal status -32 without it), and its
// Firebase project must be the same one whose service account is uploaded to OneSignal.
// Must stay at the bottom of the file.
apply plugin: 'com.google.gms.google-services'