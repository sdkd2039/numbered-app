name: Numbered
options:
  bundleIdPrefix: com.sutstudio
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true

targets:
  Numbered:
    type: application
    platform: iOS
    sources:
      - path: Numbered
      - path: Shared
        excludes:
          - Resources/**
    resources:
      - path: Shared/Resources
    dependencies:
      - target: NumberedWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sutstudio.numbered
        PRODUCT_NAME: Numbered
        INFOPLIST_FILE: Numbered/Info.plist
        CODE_SIGN_ENTITLEMENTS: Numbered/Numbered.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "معدودات"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SUPPORTS_MACCATALYST: NO

  NumberedWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NumberedWidgets
      - path: Shared
        excludes:
          - Resources/**
    resources:
      - path: Shared/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sutstudio.numbered.widgets
        PRODUCT_NAME: NumberedWidgets
        INFOPLIST_FILE: NumberedWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: NumberedWidgets/NumberedWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
