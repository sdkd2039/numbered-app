workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Clean Android Project & Build
        script: |
          # 1. تنزيل صورة أيقونة التطبيق
          mkdir -p assets/icon
          curl -sL "https://raw.githubusercontent.com/sdkd2039/Numbered/refs/heads/main/T401783946968724.png" -o assets/icon/app_icon.png
          
          # 2. إنشاء مجلد أندرويد بالاسم العربي "معدودات"
          rm -rf android
          flutter create . --platforms=android --org=com.numbered --app-name="معدودات"
          
          # 3. جلب الحزم وتوليد أيقونة أندرويد
          flutter pub get
          dart run flutter_launcher_icons

          # 4. ضبط SDK إلى 36 للتوافق مع مكتبة webview
          sed -i '' 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true

          # 5. بناء ملف APK
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
