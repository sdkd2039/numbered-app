workflows:
  android-workflow:
    name: Build Numbered App
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17

    scripts:
      - name: Build Android APK
        script: |
          echo "=== Enabling AndroidX ==="

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "=== Creating launcher icon folders ==="
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          echo "=== Downloading app icon ==="
          ICON_URL="https://raw.githubusercontent.com/sdkd2039/Numbered/refs/heads/main/T401783946968724.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            curl -fL "$ICON_URL" -o "app/src/main/res/mipmap-${density}/ic_launcher.png" || exit 1
          done

          echo "=== Building DEBUG APK ==="
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean :app:assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: false

  # Signed RELEASE APK.
  # The keystore reference must exist in Codemagic.
  android-release-workflow:
    name: Build Numbered App (Release)
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17
      android_signing:
        - numbered_release_keystore

    scripts:
      - name: Check release signing is available
        script: |
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: No Android keystore was provided by Codemagic."
            echo "Check the Android keystore reference in Codemagic."
            exit 1
          fi
          echo "Keystore provided by Codemagic (path and passwords not printed)."

      - name: Build Android Release APK
        script: |
          echo "=== Enabling AndroidX ==="

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "=== Creating launcher icon folders ==="
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          echo "=== Downloading app icon ==="
          ICON_URL="https://raw.githubusercontent.com/sdkd2039/Numbered/refs/heads/main/T401783946968724.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            curl -fL "$ICON_URL" -o "app/src/main/res/mipmap-${density}/ic_launcher.png" || exit 1
          done

          echo "=== Building RELEASE APK ==="
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean :app:assembleRelease

      - name: Verify the release APK is signed
        script: |
          ls -l app/build/outputs/apk/release/
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "ERROR: Gradle produced an unsigned APK. Check the keystore reference."
            exit 1
          fi

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: true

  # Independent Android TV APK.

  android-tv-workflow:
    name: Build Numbered TV
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17

    scripts:
      - name: Inspect TV Manifest
        script: |
          echo "=== Repository directory ==="
          pwd

          echo "=== Check TV manifest exists ==="
          if [ ! -f tv/src/main/AndroidManifest.xml ]; then
            echo "ERROR: TV AndroidManifest.xml not found"
            exit 1
          fi

          echo "=== Manifest with line numbers ==="
          nl -ba tv/src/main/AndroidManifest.xml

          echo "=== XML declaration locations ==="
          grep -n '<?xml' tv/src/main/AndroidManifest.xml || true

          echo "=== Validate XML ==="
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("tv/src/main/AndroidManifest.xml"); print("Manifest XML is valid")'

      - name: Build Android TV APK
        script: |
          echo "=== Enabling AndroidX ==="

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          chmod +x gradlew
          ./gradlew --version
          ./gradlew :tv:assembleDebug --stacktrace

    artifacts:
      - tv/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: false

  # Google Play release: signed Android App Bundle (.aab).
  android-play-aab-workflow:
    name: Build Numbered App for Google Play (AAB)
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17
      android_signing:
        - numbered_release_keystore

    scripts:
      - name: Verify release signing configuration
        script: |
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Codemagic did not provide the configured Android keystore."
            exit 1
          fi
          echo "Release keystore is available."

      - name: Install Android 16 SDK
        script: |
          echo "=== Locating Android SDK command-line tools ==="
          SDKMANAGER=""

          for SDK_ROOT in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" "$HOME/Library/Android/sdk"; do
            if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SEARCH_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
            if [ -d "$SEARCH_ROOT/cmdline-tools" ]; then
              SDKMANAGER="$(find "$SEARCH_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 -print -quit)"
            fi
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
            echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
            echo "Available Android SDK directories:"
            ls -la "$HOME/Library/Android/sdk" 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare launcher icons
        script: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          ICON_URL="https://raw.githubusercontent.com/sdkd2039/Numbered/refs/heads/main/T401783946968724.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            curl -fL "$ICON_URL" -o "app/src/main/res/mipmap-${density}/ic_launcher.png" || exit 1
          done

      - name: Build signed Google Play App Bundle
        script: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean :app:bundleRelease --stacktrace
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -s "$AAB" ]; then
            echo "ERROR: Expected AAB was not generated."
            exit 1
          fi
          jarsigner -verify "$AAB" >/dev/null
          echo "AAB exists and its signature verification passed."

    artifacts:
      - app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: true
