workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Android Project & Build
        script: |
          # إعادة إنشاء مجلد أندرويد المتوافق مع الإصدار الحديث تلقائياً
          flutter create . --platforms=android --org=com.numbered
          # بناء ملف APK
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk