
workflows:
  android-workflow:
    name: Build Numbered App
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17

    scripts:
      - name: Build Android APK
        script: |
          echo "=== Enabling AndroidX ==="

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "=== Creating launcher icon folders ==="
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          echo "=== Downloading app icon ==="
          ICON_URL="https://raw.githubusercontent.com/sdkd2039/Numbered/refs/heads/main/T401783946968724.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            curl -fL "$ICON_URL" -o "app/src/main/res/mipmap-${density}/ic_launcher.png" || exit 1
          done

          echo "=== Building DEBUG APK ==="
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean :app:assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: false

  # Signed RELEASE APK.
  # The keystore reference must exist in Codemagic.
  android-release-workflow:
    name: Build Numbered App (Release)
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17
      android_signing:
        - numbered_release_keystore

    scripts:
      - name: Check release signing is available
        script: |
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: No Android keystore was provided by Codemagic."
            echo "Check the Android keystore reference in Codemagic."
            exit 1
          fi
          echo "Keystore provided by Codemagic (path and passwords not printed)."

      - name: Build Android Release APK
        script: |
          echo "=== Enabling AndroidX ==="

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "=== Creating launcher icon folders ==="
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          echo "=== Downloading app icon ==="
          ICON_URL="https://raw.githubusercontent.com/sdkd2039/Numbered/refs/heads/main/T401783946968724.png"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            curl -fL "$ICON_URL" -o "app/src/main/res/mipmap-${density}/ic_launcher.png" || exit 1
          done

          echo "=== Building RELEASE APK ==="
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean :app:assembleRelease

      - name: Verify the release APK is signed
        script: |
          ls -l app/build/outputs/apk/release/
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "ERROR: Gradle produced an unsigned APK. Check the keystore reference."
            exit 1
          fi

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: true

  # Independent Android TV APK.
  android-tv-workflow:
    name: Build Numbered TV 1.0.3
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17

    scripts:
      - name: Build Android TV APK
        script: |
          echo "=== Enabling AndroidX ==="

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "=== Building Numbered TV 1.0.3 ==="
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :tv:assembleDebug --stacktrace --info

    artifacts:
      - tv/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: false
