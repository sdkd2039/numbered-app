workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android APK
        script: |
          cd AlalmaeyApp
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - AlalmaeyApp/app/build/outputs/apk/**/*.apk
