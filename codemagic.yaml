workflows:
  android-native-build:
    name: Build Numbered App (Android Native)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          # الانتقال لمجلد android إن وجد
          if [ -d "android" ]; then cd android; fi

          # إعطاء صلاحية التنفيذ للـ gradlew إن كان موجوداً
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Gradlew not found, generating wrapper..."
            gradle wrapper || android update project -p .
            chmod +x gradlew
            ./gradlew assembleRelease
          fi
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: false
