workflows:
  android-native-build:
    name: Build Numbered App (Android Native)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        failure: true # إرسال إشعار عبر البريد عند فشل عملية البناء
        success: false # إلغاء الإشعارات عند نجاح البناء (يمكنك تغييرها إلى true إن أردت)