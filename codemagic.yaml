workflows:
  android-native-build:
    name: Build Numbered App (Android Native)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          # الانتقال للمجلد إذا كان المشروع داخل مجلد android
          if [ -d "android" ]; then cd android; fi

          # إذا لم يكن ملف gradlew موجوداً، يتم إنشاؤه تلقائياً بواسطة gradle المثبت في النظام
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
    publishing:
      email:
        recipients:
          - sultan2021alamoudi@gmail.com
        notify:
          failure: true
          success: false
