workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Clean Android Project & Build
        script: |
          # حذف أي مجلد أندرويد قديم متضارب
          rm -rf android
          
          # إنشاء مشروع أندرويد جديد ونظيف
          flutter create . --platforms=android --org=com.numbered
          
          # رفع Android SDK إلى 36 لحل تعارض مكتبة webview
          sed -i '' 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          
          # بناء APK
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
