
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sutstudio.numberedtv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sutstudio.numberedtv'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '1.0.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            // ملفا CSV (الأذكار والمتبقي) موجودان في assets وحدة :app.
            // نستخدمهما كمصدر واحد بدل نسخهما، فيبقيان متطابقين في التطبيقين.
            assets.srcDir '../app/src/main/assets'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // قنوات وبطاقات الشاشة الرئيسية في Android TV (Preview Channels / Preview Programs)
    implementation 'androidx.tvprovider:tvprovider:1.0.0'

    // التحديث الدوري للبطاقات في الخلفية
    implementation 'androidx.work:work-runtime:2.9.1'
}
